# demo/docker-compose.yaml — Docker-only ShopDemo (no K8s)
# ========================================================
# This file is for running ShopDemo locally in Docker WITHOUT Minikube.
# It's a minimal alternative that avoids the full PPA+NEXUS+K8s stack.
#
# For the standard development workflow, run everything inside Minikube:
#   kubectl apply -f deploy/nexus/nats-statefulset.yaml
#   kubectl apply -f deploy/nexus/nexus-api-deployment.yaml
#   ppa init
#
# For the full Docker-only stack (NATS + NEXUS + ShopDemo + Orchestrator):
#   docker compose -f docker-compose.standalone.yaml up -d
#
services:

  # ── ShopDemo Backend (no NEXUS dependency) ────────────────────────────────
  shop-backend:
    build:
      context: ..          # repo root — allows COPY of src/ and pyproject.toml
      dockerfile: demo/backend/Dockerfile
    container_name: shop-demo-api
    ports: ["8001:8001"]
    environment:
      DEMO_DB_PATH: /data/shop.db
      NEXUS_API_URL: ""   # NEXUS not running; leave empty for local-only mode
      SELFHEAL_TOKEN: ${SELFHEAL_TOKEN:-}
      NEXUS_LLM_API_KEY: ${NEXUS_LLM_API_KEY:-}
    volumes:
      - shop_data:/data

  # ── Demo Orchestrator (no NEXUS dependency) ────────────────────────────────
  demo-orchestrator:
    build:
      context: ..          # repo root — same image as shop-backend, different CMD
      dockerfile: demo/backend/Dockerfile
    container_name: nexus-demo-orchestrator
    command: python -m demo_orchestrator
    environment:
      NEXUS_API_URL: ""    # NEXUS not running; leave empty for local-only mode
      DEMO_API_URL: http://shop-backend:8001
      NEXUS_AUDIT_DB_PATH: /data/nexus_audit.db
      NEXUS_LLM_API_KEY: ${NEXUS_LLM_API_KEY:-}
      SELFHEAL_TOKEN: ${SELFHEAL_TOKEN:-}
    volumes:
      - nexus_data:/data
    depends_on:
      - shop-backend

volumes:
  nexus_data:
    shop_data