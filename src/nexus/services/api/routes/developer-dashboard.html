<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>NEXUS Autonomous SRE Control Plane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    /* TweakCN Theme Tokens: cmgcc1d39000204ky3qhj3qt3 */
    :root {
      color-scheme: light;
      --background: oklch(0.9800 0.0300 260);
      --foreground: oklch(0.0600 0.0100 270);
      --card: oklch(0.9900 0.0200 260);
      --card-foreground: oklch(0.0600 0.0100 270);
      --popover: oklch(0.9800 0.0300 260);
      --popover-foreground: oklch(0.0600 0.0100 270);
      --primary: oklch(0.0600 0.0100 270);
      --primary-foreground: oklch(0.9800 0.0300 260);
      --secondary: oklch(0.9400 0 0);
      --secondary-foreground: oklch(0.0600 0.0100 270);
      --muted: oklch(0.9700 0 0);
      --muted-foreground: oklch(0.4400 0 0);
      --accent: oklch(0.9400 0 0);
      --accent-foreground: oklch(0.0600 0.0100 270);
      --destructive: oklch(0.6300 0.1900 23.0300);
      --destructive-foreground: oklch(0.9800 0.0300 260);
      --border: oklch(0.9200 0 0);
      --input: oklch(0.9400 0 0);
      --ring: oklch(0.0600 0.0100 270);
      --chart-1: oklch(0.8100 0.1700 75.3500);
      --chart-2: oklch(0.5500 0.2200 264.5300);
      --chart-3: oklch(0.7200 0 0);
      --chart-4: oklch(0.9200 0 0);
      --chart-5: oklch(0.5600 0 0);
      --sidebar: oklch(0.9800 0.0300 260);
      --sidebar-foreground: oklch(0.0600 0.0100 270);
      --sidebar-primary: oklch(0.0600 0.0100 270);
      --sidebar-primary-foreground: oklch(0.9800 0.0300 260);
      --sidebar-accent: oklch(0.9400 0 0);
      --sidebar-accent-foreground: oklch(0.0600 0.0100 270);
      --sidebar-border: oklch(0.9400 0 0);
      --sidebar-ring: oklch(0.0600 0.0100 270);
      --font-sans: "Geist", system-ui, -apple-system, sans-serif;
      --font-serif: Georgia, serif;
      --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      /* taste-skill-ignore */
      --radius: 0.5rem;
      --radius-sm: calc(var(--radius) - 4px);
      --radius-md: calc(var(--radius) - 2px);
      --radius-lg: var(--radius);
      --shadow-sm: 0px 1px 2px 0px hsl(0 0% 0% / 0.18), 0px 1px 2px -1px hsl(0 0% 0% / 0.18);
      --shadow-lg: 0px 1px 2px 0px hsl(0 0% 0% / 0.18), 0px 4px 6px -1px hsl(0 0% 0% / 0.18);
      --sidebar-width: 216px;

      /* Accessible semantic status colors (WCAG >= 4.5:1 on light) */
      --status-ok-bg: oklch(0.9500 0.0350 160);
      --status-ok-fg: oklch(0.3400 0.1100 160);
      --status-ok-border: oklch(0.8600 0.0650 160);
      --status-warn-bg: oklch(0.9600 0.0450 75.35);
      --status-warn-fg: oklch(0.4200 0.1300 75.35);
      --status-warn-border: oklch(0.8600 0.0950 75.35);
      --status-err-bg: oklch(0.9550 0.0350 23.03);
      --status-err-fg: oklch(0.4500 0.1800 23.03);
      --status-err-border: oklch(0.8500 0.0850 23.03);
      --status-info-bg: oklch(0.9500 0.0400 264.53);
      --status-info-fg: oklch(0.4200 0.1800 264.53);
      --status-info-border: oklch(0.8500 0.0850 264.53);
    }

    .dark {
      color-scheme: dark;
      --background: oklch(0.0400 0.0050 270);
      --foreground: oklch(0.8800 0.0400 260);
      --card: oklch(0.1400 0.0050 270);
      --card-foreground: oklch(0.8800 0.0400 260);
      --popover: oklch(0.1800 0.0050 270);
      --popover-foreground: oklch(0.8800 0.0400 260);
      --primary: oklch(0.8800 0.0400 260);
      --primary-foreground: oklch(0.0400 0.0050 270);
      --secondary: oklch(0.2500 0 0);
      --secondary-foreground: oklch(0.8800 0.0400 260);
      --muted: oklch(0.2300 0 0);
      --muted-foreground: oklch(0.7200 0 0);
      --accent: oklch(0.3200 0 0);
      --accent-foreground: oklch(0.8800 0.0400 260);
      --destructive: oklch(0.6900 0.2000 23.9100);
      --destructive-foreground: oklch(0.0400 0.0050 270);
      --border: oklch(0.2600 0 0);
      --input: oklch(0.3200 0 0);
      --ring: oklch(0.7200 0 0);
      --chart-1: oklch(0.8100 0.1700 75.3500);
      --chart-2: oklch(0.5800 0.2100 260.8400);
      --chart-3: oklch(0.5600 0 0);
      --chart-4: oklch(0.4400 0 0);
      --chart-5: oklch(0.9200 0 0);
      --sidebar: oklch(0.1800 0.0050 270);
      --sidebar-foreground: oklch(0.8800 0.0400 260);
      --sidebar-primary: oklch(0.8800 0.0400 260);
      --sidebar-primary-foreground: oklch(0.0400 0.0050 270);
      --sidebar-accent: oklch(0.3200 0 0);
      --sidebar-accent-foreground: oklch(0.8800 0.0400 260);
      --sidebar-border: oklch(0.3200 0 0);
      --sidebar-ring: oklch(0.7200 0 0);

      /* Accessible semantic status colors (WCAG >= 4.5:1 on dark) */
      --status-ok-bg: oklch(0.2000 0.0400 160);
      --status-ok-fg: oklch(0.7700 0.1300 160);
      --status-ok-border: oklch(0.3400 0.0750 160);
      --status-warn-bg: oklch(0.2200 0.0450 75.35);
      --status-warn-fg: var(--chart-1);
      --status-warn-border: oklch(0.4000 0.0950 75.35);
      --status-err-bg: oklch(0.2100 0.0500 23.91);
      --status-err-fg: oklch(0.7700 0.1600 23.91);
      --status-err-border: oklch(0.3900 0.1050 23.91);
      --status-info-bg: oklch(0.2100 0.0550 260.84);
      --status-info-fg: oklch(0.7800 0.1400 260.84);
      --status-info-border: oklch(0.3700 0.1050 260.84);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-color: var(--border);
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      height: 100%;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .sr-only:where(:not(:focus-within, :active)) {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }

    :where(a:any-link, button, input, summary):focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    code,
    pre {
      font-family: var(--font-mono);
      /* taste-skill-ignore */
    }

    .ph-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle;
    }

    /* ============================================================
       App Shell: Sidebar + Full-Height Main Inset
       ============================================================ */
    .shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      height: 100vh;
      overflow: hidden;
    }

    .shell.sidebar-collapsed {
      grid-template-columns: 0px minmax(0, 1fr);
    }

    .shell.sidebar-collapsed .sidebar {
      transform: translateX(-100%);
      pointer-events: none;
      border-right-color: transparent;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: hsl(0 0% 0% / 0.5);
      z-index: 35;
    }

    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      background: var(--sidebar);
      color: var(--sidebar-foreground);
      border-right: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 40;
    }

    .sidebar-header {
      height: 52px;
      padding: 0 14px;
      border-bottom: 1px solid var(--sidebar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-mark {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      background: var(--sidebar-primary);
      color: var(--sidebar-primary-foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--sidebar-foreground);
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
    }

    .nav-item {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border: none;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--muted-foreground);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
    }

    .nav-item-left {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .nav-item:hover {
      background: var(--sidebar-accent);
      color: var(--sidebar-accent-foreground);
    }

    .nav-item.active {
      background: var(--sidebar-accent);
      color: var(--sidebar-accent-foreground);
      font-weight: 600;
    }

    .nav-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--status-warn-fg);
      font-variant-numeric: tabular-nums;
    }

    .sidebar-footer {
      padding: 10px;
      border-top: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }

    /* ============================================================
       Main Column: Slim Topbar + Hairline Telemetry Strip + Split View
       ============================================================ */
    .main-inset {
      min-width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--background);
      overflow: hidden;
    }

    .topbar {
      height: 52px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .page-h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .search-wrap {
      position: relative;
      width: 220px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-foreground);
      pointer-events: none;
    }

    .shadcn-input {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--input);
      background: var(--card);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 13px;
    }

    .shadcn-input.has-icon {
      padding-left: 30px;
    }

    .shadcn-input::placeholder {
      color: var(--muted-foreground);
    }

    .engine-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground);
      padding: 0 4px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--status-ok-fg);
      flex-shrink: 0;
    }

    .status-dot.offline {
      background: var(--status-err-fg);
    }

    /* Flat 1-Row Telemetry Bar (replaces 4 floating cards) */
    .telemetry-strip {
      min-height: 40px;
      padding: 6px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .telemetry-metrics {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .metric-inline {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .metric-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--foreground);
      font-variant-numeric: tabular-nums;
    }

    .metric-val.warn {
      color: var(--status-warn-fg);
    }

    .metric-sub {
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
    }

    .telemetry-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted-foreground);
    }

    /* Buttons (Flat shadcn, zero box-shadow) */
    .btn {
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .btn-sm {
      height: 28px;
      padding: 0 10px;
      font-size: 12px;
    }

    .btn-icon {
      width: 30px;
      height: 30px;
      padding: 0;
    }

    .btn-default {
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .btn-default:hover:not(:disabled) {
      opacity: 0.9;
    }

    .btn-outline {
      background: transparent;
      color: var(--foreground);
      border-color: var(--border);
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted-foreground);
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    .btn-destructive {
      background: var(--status-err-bg);
      color: var(--status-err-fg);
      border-color: var(--status-err-border);
    }

    .btn-destructive:hover:not(:disabled) {
      opacity: 0.88;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Operator Status Toast */
    .status-toast {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      font-size: 13px;
      flex-shrink: 0;
    }

    .status-toast.visible {
      display: flex;
    }

    .status-toast.success {
      color: var(--status-ok-fg);
      background: var(--status-ok-bg);
    }

    .status-toast.error {
      color: var(--status-err-fg);
      background: var(--status-err-bg);
    }

    /* ============================================================
       Full-Bleed Master-Detail Split Workspace
       ============================================================ */
    .workspace-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 336px minmax(0, 1fr);
    }

    /* Left Thread Queue */
    .queue-pane {
      border-right: 1px solid var(--border);
      background: var(--background);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .queue-head {
      padding: 12px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .queue-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--foreground);
    }

    .queue-sub {
      font-size: 12px;
      color: var(--muted-foreground);
    }

    /* Clean Underline Filter Tabs (Zero box, zero scrollbar) */
    .filter-tabs {
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .filter-tab {
      position: relative;
      height: 32px;
      padding: 0 8px;
      border: none;
      background: transparent;
      color: var(--muted-foreground);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-tab:hover {
      color: var(--foreground);
    }

    .filter-tab.active {
      color: var(--foreground);
      font-weight: 600;
    }

    .filter-tab.active::after {
      content: "";
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: -1px;
      height: 2px;
      background: var(--foreground);
      border-radius: 2px 2px 0 0;
    }

    .incident-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .incident-row {
      position: relative;
      width: 100%;
      text-align: left;
      padding: 13px 16px;
      border: none;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--foreground);
      font-family: var(--font-sans);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .incident-row:hover {
      background: var(--muted);
    }

    .incident-row.selected {
      background: var(--card);
    }

    .incident-row.selected::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--chart-2);
    }

    .incident-row.interrupt-active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--chart-1);
    }

    .row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .row-target {
      font-size: 13px;
      font-weight: 500;
      color: var(--foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .incident-row.selected .row-target {
      font-weight: 600;
    }

    /* Quiet inline status text instead of boxed pills on every row */
    .row-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      flex: none;
    }

    .row-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .tone-ok {
      color: var(--status-ok-fg);
    }

    .tone-warn {
      color: var(--status-warn-fg);
    }

    .tone-err {
      color: var(--status-err-fg);
    }

    .tone-info {
      color: var(--status-info-fg);
    }

    .tone-muted {
      color: var(--muted-foreground);
    }

    .row-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .row-meta-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
    }

    .row-slug {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .queue-empty {
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
      color: var(--muted-foreground);
    }

    /* ============================================================
       Right Inspector Pane (Calm, Single-Column, Hairline-Divided)
       ============================================================ */
    .inspector {
      min-width: 0;
      height: 100%;
      overflow-y: auto;
      background: var(--background);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .inspector-inner {
      max-width: 820px;
      padding: 24px 32px 48px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .mobile-back-btn {
      display: none;
      align-self: flex-start;
    }

    /* Calm Status Pill (used ONLY once for the selected incident header) */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 22px;
      padding: 0 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .pill-ok {
      background: var(--status-ok-bg);
      color: var(--status-ok-fg);
      border-color: var(--status-ok-border);
    }

    .pill-warn {
      background: var(--status-warn-bg);
      color: var(--status-warn-fg);
      border-color: var(--status-warn-border);
    }

    .pill-err {
      background: var(--status-err-bg);
      color: var(--status-err-fg);
      border-color: var(--status-err-border);
    }

    .pill-info {
      background: var(--status-info-bg);
      color: var(--status-info-fg);
      border-color: var(--status-info-border);
    }

    .pill-muted {
      background: var(--secondary);
      color: var(--secondary-foreground);
      border-color: var(--border);
    }

    /* Incident Header */
    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .detail-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .detail-id {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--foreground);
      font-variant-numeric: tabular-nums;
    }

    .detail-meta-line {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted-foreground);
    }

    .detail-meta-strong {
      color: var(--foreground);
      font-weight: 500;
    }

    .report-muted {
      font-size: 12px;
      color: var(--muted-foreground);
      white-space: nowrap;
      padding-top: 4px;
    }

    /* Minimal Connected Stepper (No 8 Rounded Boxes) */
    .stepper-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stepper-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .stepper-rail {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 0;
      align-items: start;
    }

    .step-node {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .step-node::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border);
      z-index: 0;
    }

    .step-node:first-child::before {
      left: 50%;
    }

    .step-node:last-child::before {
      right: 50%;
    }

    .step-node.visited::before {
      background: var(--status-ok-border);
    }

    .step-dot {
      position: relative;
      z-index: 1;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--background);
      border: 2px solid var(--border);
    }

    .step-node.visited .step-dot {
      background: var(--status-ok-fg);
      border-color: var(--status-ok-fg);
    }

    .step-node.visited {
      color: var(--foreground);
    }

    .step-node.skipped .step-dot {
      border-style: dashed;
      border-color: var(--status-ok-fg);
    }

    .step-node.active .step-dot {
      background: var(--chart-2);
      border-color: var(--chart-2);
    }

    .step-node.active {
      color: var(--status-info-fg);
      font-weight: 600;
    }

    .step-node.interrupted .step-dot {
      background: var(--chart-1);
      border-color: var(--chart-1);
    }

    .step-node.interrupted {
      color: var(--status-warn-fg);
      font-weight: 600;
    }

    .step-node.failed .step-dot {
      background: var(--status-err-fg);
      border-color: var(--status-err-fg);
    }

    .step-node.failed {
      color: var(--status-err-fg);
      font-weight: 600;
    }

    /* Focused HITL Approval Strip */
    .hitl-strip {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      border-left: 3px solid var(--chart-1);
      background: var(--card);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hitl-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--foreground);
    }

    .hitl-desc {
      font-size: 13px;
      color: var(--muted-foreground);
    }

    .hitl-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hitl-controls .shadcn-input {
      flex: 1;
      min-width: 220px;
      background: var(--background);
    }

    /* Escalation Banner */
    .error-strip {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--status-err-border);
      background: var(--status-err-bg);
      color: var(--status-err-fg);
      font-size: 13px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    /* Inspector Sub-Tabs */
    .inspector-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
      border-bottom: 1px solid var(--border);
    }

    .inspector-tab {
      position: relative;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--muted-foreground);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .inspector-tab:hover {
      color: var(--foreground);
    }

    .inspector-tab.active {
      color: var(--foreground);
      font-weight: 600;
    }

    .inspector-tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--foreground);
    }

    /* Flat Sections inside Inspector (Hairlines, Zero Nested Cards) */
    .section-block {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-divider {
      height: 1px;
      background: var(--border);
      width: 100%;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--foreground);
    }

    .section-tag {
      font-size: 12px;
      font-weight: 500;
    }

    /* Progress Bar */
    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--secondary);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--chart-2);
    }

    .progress-fill.low {
      background: var(--status-err-fg);
    }

    /* Clean Prose & Property Rows */
    .prose-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground);
    }

    .field-body {
      font-size: 14px;
      color: var(--foreground);
      line-height: 1.55;
    }

    .prop-grid {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      row-gap: 8px;
      column-gap: 16px;
      font-size: 13px;
    }

    .prop-key {
      color: var(--muted-foreground);
    }

    .prop-val {
      color: var(--foreground);
      word-break: break-word;
    }

    /* Minimal Evidence Accordion (No outer box, just hairlines) */
    .evidence-list {
      border-top: 1px solid var(--border);
    }

    .evidence-details {
      border-bottom: 1px solid var(--border);
    }

    .evidence-summary {
      list-style: none;
      padding: 8px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: var(--foreground);
    }

    .evidence-summary::-webkit-details-marker {
      display: none;
    }

    .evidence-summary:hover {
      color: var(--muted-foreground);
    }

    .evidence-summary-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .evidence-caret {
      color: var(--muted-foreground);
      flex-shrink: 0;
    }

    .evidence-details[open] .evidence-caret {
      transform: rotate(180deg);
    }

    pre.evidence-body {
      padding: 0 0 10px;
      font-size: 12px;
      color: var(--muted-foreground);
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }

    /* Clean Tool Call / Execution Rows */
    .step-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .step-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
    }

    .step-tool {
      font-weight: 600;
      color: var(--foreground);
    }

    .step-attrs {
      font-size: 12px;
      color: var(--muted-foreground);
    }

    pre.code-block {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 12px;
      line-height: 1.5;
      color: var(--card-foreground);
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* Predictions Full Table View */
    .predictions-pane {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 32px;
    }

    .predictions-inner {
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .table-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--card);
      overflow-x: auto;
    }

    table.shadcn-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.shadcn-table th {
      height: 38px;
      padding: 0 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    table.shadcn-table td {
      height: 44px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--card-foreground);
    }

    table.shadcn-table tbody tr:last-child td {
      border-bottom: none;
    }

    table.shadcn-table th.num,
    table.shadcn-table td.num {
      text-align: right;
    }

    @media (prefers-reduced-motion: no-preference) {

      .btn,
      .nav-item,
      .filter-tab,
      .inspector-tab,
      .incident-row,
      .evidence-caret,
      .sidebar {
        transition: color 0.14s ease, background-color 0.14s ease, border-color 0.14s ease, transform 0.18s ease, opacity 0.14s ease;
      }
    }

    /* ============================================================
       Tablet & Mobile Responsive Breakpoints
       ============================================================ */
    @media (max-width: 1080px) {

      .shell,
      .shell.sidebar-collapsed {
        grid-template-columns: minmax(0, 1fr);
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow-lg);
        /* taste-skill-ignore */
      }

      .shell.mobile-sidebar-open .sidebar {
        transform: translateX(0);
        pointer-events: auto;
      }

      .shell.mobile-sidebar-open .sidebar-backdrop {
        display: block;
      }

      .workspace-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .queue-pane {
        border-right: none;
      }

      .workspace-grid.mobile-detail-open .queue-pane {
        display: none;
      }

      .workspace-grid:not(.mobile-detail-open) .inspector {
        display: none;
      }

      .workspace-grid.mobile-detail-open .mobile-back-btn {
        display: inline-flex;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 0 14px;
      }

      .search-wrap {
        display: none;
      }

      .telemetry-strip {
        padding: 8px 14px;
        gap: 10px;
      }

      .telemetry-metrics {
        gap: 12px;
      }

      .inspector-inner {
        padding: 18px 16px 36px;
        gap: 20px;
      }

      .detail-header {
        flex-direction: column;
        gap: 8px;
      }

      .stepper-rail {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        row-gap: 12px;
      }

      .step-node::before {
        display: none;
      }

      .prop-grid {
        grid-template-columns: minmax(0, 1fr);
        row-gap: 4px;
      }

      .hitl-controls .shadcn-input {
        min-width: 100%;
      }

      .predictions-pane {
        padding: 16px;
      }
    }
  </style>
</head>

    function applyTheme(theme) {
      const root = document.documentElement;
      const isDark = theme === "dark";
      root.classList.toggle("dark", isDark);
      const iconUse = document.querySelector("#theme-toggle-icon use");
      const label = document.getElementById("theme-toggle-label");
      if (iconUse) iconUse.setAttribute("href", isDark ? "#ph-sun" : "#ph-moon");
      if (label) label.textContent = isDark ? "Light mode" : "Dark mode";
      try {
        localStorage.setItem("nexus-theme", theme);
      } catch (_) { }
    }

    function initTheme() {
      const paramTheme = new URLSearchParams(window.location.search).get("theme");
      if (paramTheme === "light" || paramTheme === "dark") {
        applyTheme(paramTheme);
        return;
      }
      try {
        const saved = localStorage.getItem("nexus-theme");
        if (saved === "light" || saved === "dark") {
          applyTheme(saved);
          return;
        }
      } catch (_) { }
      applyTheme("dark");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function statusToneClass(status) {
      const s = String(status || "").toUpperCase();
      if (s === "RESOLVED" || s === "AUTO_APPROVED" || s === "APPROVED") return "tone-ok";
      if (s === "AWAITING_APPROVAL" || s === "PENDING") return "tone-warn";
      if (["ESCALATED", "ROLLED_BACK", "EXECUTION_FAILED", "POLICY_DENIED", "VERIFICATION_FAILED"].includes(s)) return "tone-err";
      return "tone-info";
    }

    function statusPillClass(status) {
      const s = String(status || "").toUpperCase();
      if (s === "RESOLVED" || s === "AUTO_APPROVED" || s === "APPROVED") return "pill-ok";
      if (s === "AWAITING_APPROVAL" || s === "PENDING") return "pill-warn";
      if (["ESCALATED", "ROLLED_BACK", "EXECUTION_FAILED", "POLICY_DENIED", "VERIFICATION_FAILED"].includes(s)) return "pill-err";
      return "pill-info";
    }

    function formatStatusLabel(status) {
      const text = String(status || "OPEN").replace(/_/g, " ").toLowerCase();

      const policy = raw.policy_decision || {};
      const approval = raw.approval || {};
      const execution = raw.execution || {};
      const verification = raw.verification || {};
      const rollback = raw.rollback || {};

      const status = String(raw.status || (raw.outcome === "success" ? "RESOLVED" : "OPEN")).toUpperCase();
      const execResults = Array.isArray(execution.results)
        ? execution.results
        : (Array.isArray(raw.execution_results) ? raw.execution_results : []);
      const rollbackResults = Array.isArray(rollback.results)
        ? rollback.results
        : (Array.isArray(raw.rollback_results) ? raw.rollback_results : []);
      const evidence = Array.isArray(raw.evidence)
        ? raw.evidence
        : (Array.isArray(rca.evidence) ? rca.evidence : []);
      const steps = Array.isArray(plan.steps) ? plan.steps : [];

      return {
        incident_id: raw.incident_id || "INC-UNKNOWN",
        updated_at: raw.updated_at || raw.timestamp || "",
        platform: raw.platform || "k8s",
        namespace: raw.namespace || "default",
        resource_kind: raw.resource_kind || "Deployment",
        service_name: raw.service_name || raw.target || "unknown",

        status,
        active_node: String(raw.active_node || "TRIAGE").toUpperCase(),
        failure_class: raw.failure_class || rca.failure_type || "investigating",
        suspected_cause: raw.suspected_cause || rca.root_cause_summary || raw.description || "Awaiting ReAct diagnosis...",
        confidence: Number(raw.confidence ?? rca.confidence ?? 0),
        min_confidence_threshold: Number(raw.min_confidence_threshold ?? 0.65),
        can_auto_remediate: raw.can_auto_remediate ?? rca.can_auto_remediate ?? false,
        recommended_strategy: raw.recommended_strategy || rca.recommended_strategy || plan.rationale || "",
        evidence,
        steps,
        policy: {
          allowed: policy.allowed ?? true,
          requires_approval: policy.requires_approval ?? (raw.requires_approval || false),
          reason: policy.reason || "Evaluated via zero-trust OPA policy"
        },
        approval: {
          is_interrupted: Boolean(approval.is_interrupted || status === "AWAITING_APPROVAL"),
          approval_status: approval.approval_status || raw.approval_status || (status === "AWAITING_APPROVAL" ? "PENDING" : "NONE"),
          approved: approval.approved ?? raw.approved ?? null,
          approved_by: approval.approved_by || raw.approved_by || raw.accepted_by || null,
          approval_reason: approval.approval_reason || raw.approval_reason || null
        },
        execution: {
          status: execution.execution_status || raw.execution_status || "PENDING",
          results: execResults,
          attempts: Number(execution.remediation_attempts ?? raw.remediation_attempts ?? 0),
          max_attempts: Number(execution.max_remediation_attempts ?? raw.max_remediation_attempts ?? 2)
        },
        verification: {
          passed: verification.verification_passed ?? raw.verification_passed ?? null,
          feedback: verification.verification_feedback || raw.verification_feedback || ""
        },
        rollback: {
          available: Boolean(rollback.rollback_available ?? raw.rollback_available ?? false),
          results: rollbackResults
        },
        post_incident_report_ready: Boolean(
          raw.post_incident_report_ready !== undefined
            ? raw.post_incident_report_ready
            : (execResults.length > 0 && ["RESOLVED", "ROLLED_BACK"].includes(status))
        ),
        error: raw.error || null
      };
    }

    async function fetchIncidents(manual = false) {
      if (isDemoMode) {
        updateKpis();
        renderSidebar();
        renderPredictionsView();
        return;
      }
      try {
        const [incRes, predRes] = await Promise.all([
          fetch("/developer/incidents?n=50"),
          fetch("/developer/predictions?n=50").catch(() => null)
        ]);
        if (!incRes.ok) throw new Error(`HTTP ${incRes.status}`);
        const data = await incRes.json();
        incidents = (Array.isArray(data) ? data : []).map(normalizeIncident);

        if (predRes && predRes.ok) {
          const predData = await predRes.json();
          predictions = Array.isArray(predData) ? predData : [];
        } else {
          predictions = [];
        }

        setConnectionState(true);
        const nowStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        document.getElementById("freshness-stamp").textContent = `Synced ${nowStr}`;

        updateKpis();
        renderSidebar();
        renderPredictionsView();

        if (!selectedIncidentId && incidents.length > 0) {
          selectedIncidentId = incidents[0].incident_id;
        }
        const selected = incidents.find(i => i.incident_id === selectedIncidentId);
        if (selected) {
          renderInspector(selected, manual);
        } else if (incidents.length > 0) {
          selectedIncidentId = incidents[0].incident_id;
          renderInspector(incidents[0], true);
        } else {
          renderEmptyInspector();
        }
      } catch (err) {
        console.error("Failed to fetch developer incidents:", err);
        setConnectionState(false);
        document.getElementById("freshness-stamp").textContent = "API unreachable";
        updateKpis();
        renderSidebar();
        renderPredictionsView();
        if (incidents.length === 0) renderEmptyInspector();
      }
    }

    function updateKpis() {
      const total = incidents.length;
      const awaiting = incidents.filter(i => i.approval.is_interrupted).length;
      const resolved = incidents.filter(i => i.status === "RESOLVED").length;
      const terminal = incidents.filter(i => ["RESOLVED", "ESCALATED", "ROLLED_BACK", "EXECUTION_FAILED", "POLICY_DENIED"].includes(i.status)).length;
      const successRateText = terminal > 0 ? `(${Math.round((resolved / terminal) * 100)}%)` : "";

      document.getElementById("kpi-total").textContent = total;
      const apprEl = document.getElementById("kpi-approvals");
      apprEl.textContent = awaiting;
      apprEl.classList.toggle("warn", awaiting > 0);
      document.getElementById("kpi-resolved").textContent = resolved;
      document.getElementById("kpi-success-rate").textContent = successRateText;
      document.getElementById("kpi-ppa-events").textContent = predictions.length;

      const navBadge = document.getElementById("nav-approval-count");
      if (navBadge) {
        navBadge.textContent = awaiting;
        navBadge.hidden = awaiting === 0;
      }
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll(".nav-item[data-view]").forEach(btn => {
        const active = btn.dataset.view === view;
        btn.classList.toggle("active", active);
        if (active) btn.setAttribute("aria-current", "page");
        else btn.removeAttribute("aria-current");
      });

      const workspace = document.getElementById("workspace-grid");
      const predView = document.getElementById("predictions-view");

      if (view === "predictions") {
        workspace.hidden = true;
        predView.hidden = false;
        renderPredictionsView();
      } else {
        workspace.hidden = false;
        predView.hidden = true;
        if (view === "approvals") {
          setFilter("APPROVAL");
        } else if (view === "incidents" && currentFilter === "APPROVAL") {
          setFilter("ALL");
        }
      }
      closeMobileSidebar();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll(".filter-tab").forEach(btn => {
        const active = btn.dataset.filter === filter;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-selected", String(active));
      });
      renderSidebar();
    }

    function getFilteredIncidents() {
      const q = searchQuery.trim().toLowerCase();
      return incidents.filter(inc => {
        if (currentFilter === "APPROVAL" && !inc.approval.is_interrupted) return false;
        if (currentFilter === "RESOLVED" && inc.status !== "RESOLVED") return false;
        if (currentFilter === "ESCALATED" && !["ESCALATED", "ROLLED_BACK", "EXECUTION_FAILED", "POLICY_DENIED"].includes(inc.status)) return false;
        if (currentFilter === "ACTIVE" && ["RESOLVED", "ESCALATED", "ROLLED_BACK", "POLICY_DENIED"].includes(inc.status)) return false;
        if (q) {
          const hay = `${inc.incident_id} ${inc.target_resource} ${inc.failure_class} ${inc.suspected_cause}`.toLowerCase();
          return hay.includes(q);
        }
        return true;
      });
    }

    function closeMobileDetail() {
      const grid = document.getElementById("workspace-grid");

    function getStepStateClass(nodeId, inc) {
      const nodeIds = GRAPH_NODES.map(n => n.id);
      const activeIdx = nodeIds.indexOf(inc.active_node);
      const idx = nodeIds.indexOf(nodeId);

      if (nodeId === "APPROVAL") {
        if (inc.approval.is_interrupted) return "interrupted";
        if (inc.approval.approval_status === "REJECTED") return "failed";
        if (inc.approval.approval_status === "AUTO_APPROVED") return "skipped";
      }

      if (inc.status === "RESOLVED" && idx <= nodeIds.indexOf("LEARN")) {
        return "visited";
      }

      if (inc.active_node === "ROLLBACK" || inc.active_node === "ESCALATE") {
        if (nodeId === "TRIAGE") return "visited";
        if (nodeId === "DIAGNOSE") return inc.confidence > 0 || inc.failure_class !== "investigating" ? "visited" : "failed";
        if (nodeId === "PLAN") return inc.steps.length > 0 ? "visited" : (inc.status === "UNPLANNABLE" ? "failed" : "");
        if (nodeId === "GOVERN") return inc.policy.allowed === false ? "failed" : (inc.steps.length > 0 ? "visited" : "");
        if (nodeId === "APPROVAL") {
          if (inc.approval.approval_status === "APPROVED") return "visited";
          if (inc.approval.approval_status === "AUTO_APPROVED") return "skipped";
          if (inc.approval.approval_status === "REJECTED") return "failed";
          return "";
        }
        if (nodeId === "EXECUTE") {
          if (inc.execution.status === "FAILED") return "failed";
          return inc.execution.results.length > 0 ? "visited" : "";
        }
        if (nodeId === "VERIFY") {
          if (inc.verification.passed === false) return "failed";
          if (inc.verification.passed === true) return "visited";
          return "";
        }
        return "";
      }

      if (activeIdx !== -1) {
        if (idx < activeIdx) return "visited";
        if (idx === activeIdx) {
          if (["EXECUTION_FAILED", "VERIFICATION_FAILED", "POLICY_DENIED"].includes(inc.status)) return "failed";
          return "active";
        }
      }
      return "";
    }

                    data-inspector-tab="execution"
                    role="tab"
                    aria-selected="${activeInspectorTab === "execution"}">
              Execution &amp; Verify
              <span class="num" style="font-size:12px; color:var(--muted-foreground);">(${inc.execution.results.length})</span>
            </button>
          </div>

          ${activeInspectorTab === "overview" ? overviewHtml : executionHtml}
        </div>
      `;

      if (wasInputFocused) {
        const restored = document.getElementById("approval-reason-input");
        if (restored) {
          restored.focus();
          restored.setSelectionRange(restored.value.length, restored.value.length);
        }
      }
    }

    function renderPredictionsView() {
      const countEl = document.getElementById("predictions-count");
      const bodyEl = document.getElementById("predictions-body");
      if (countEl) {
        countEl.textContent = `${predictions.length} predictive scaling decision${predictions.length === 1 ? "" : "s"}`;
      }
      if (!bodyEl) return;

      if (predictions.length === 0) {
        bodyEl.innerHTML = `<div class="queue-empty"><p>No predictive scaling decisions recorded yet.</p></div>`;
        return;
      }

      bodyEl.innerHTML = `
        <table class="shadcn-table">
          <thead>
            <tr>
              <th>Workload</th>
              <th>Namespace</th>
              <th class="num">Current RPS</th>
              <th class="num">Predicted RPS</th>
              <th class="num">Scale</th>
              <th class="num">Replicas</th>
              <th>Mode</th>
            </tr>
          </thead>
          <tbody>
            ${predictions.map(p => {
        const target = p.target || p.service || p.deployment || "workload";
        const ns = p.namespace || "default";
        const cur = p.current_rps ?? p.current_load ?? "—";
        const pred = p.predicted_rps ?? p.predicted_load ?? "—";
        const scale = p.scale_factor ? `${Number(p.scale_factor).toFixed(2)}x` : "—";
        const rep = p.desired_replicas ?? p.target_replicas ?? "—";
        const mode = p.mode || p.action || "advisory";
        return `
                <tr>
                  <td><strong>${escapeHtml(target)}</strong></td>
                  <td>${escapeHtml(ns)}</td>
                  <td class="num">${escapeHtml(String(cur))}</td>
                  <td class="num">${escapeHtml(String(pred))}</td>
                  <td class="num">${escapeHtml(scale)}</td>
                  <td class="num">${escapeHtml(String(rep))}</td>
                  <td>${escapeHtml(mode)}</td>
                </tr>
              `;
      }).join("")}
          </tbody>
        </table>
      `;
    }

    async function submitApprovalDecision(incidentId, approved) {
      if (submittingIncidents.has(incidentId)) return;

      const reasonInput = document.getElementById("approval-reason-input");
      const reason = reasonInput && reasonInput.value.trim()
        ? reasonInput.value.trim()
        : (approved ? "Approved from NEXUS developer dashboard" : "Rejected from NEXUS developer dashboard");

      if (isDemoMode) {
        const target = incidents.find(i => i.incident_id === incidentId);
        if (target) {
          target.approval.is_interrupted = false;
          target.approval.approved = approved;
          target.approval.approved_by = "dashboard-operator";
          target.approval.approval_reason = reason;
          target.approval.approval_status = approved ? "APPROVED" : "REJECTED";
          if (approved) {
            target.status = "RESOLVED";
            target.active_node = "LEARN";
            target.execution.status = "EXECUTED";
            target.execution.attempts = 1;
            target.execution.results = [{
              step: 1,
              tool_name: target.steps[0]?.tool_name || "k8s_rollback_deployment",
              status: "SUCCESS",
              duration_ms: 918,
              output: "Rolled back Deployment/shop-demo to revision 13; 3/3 pods Ready"
            }];
            target.verification.passed = true;
            target.verification.feedback = "Readiness probe /healthz returned 200 OK across all 3 replicas.";
            target.post_incident_report_ready = true;
            activeInspectorTab = "execution";
          } else {
            target.status = "ESCALATED";
            target.active_node = "ESCALATE";
            target.error = `Operator rejected remediation: ${reason}`;
          }
          approvalDrafts.delete(incidentId);
          lastInspectorSignature = null;
          updateKpis();
          renderSidebar();
          renderInspector(target, true);
          showStatusBanner(
            approved
              ? `Preview: thread ${incidentId} resumed and verified.`
              : `Preview: thread ${incidentId} rejected and escalated.`,
            approved ? "success" : "error"
          );
        }
        return;
      }

      submittingIncidents.add(incidentId);
      const current = incidents.find(i => i.incident_id === incidentId);
      if (current) renderInspector(current, true);

      const endpoint = approved
        ? `/developer/incidents/${encodeURIComponent(incidentId)}/approve`
        : `/developer/incidents/${encodeURIComponent(incidentId)}/reject`;

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            incident_id: incidentId,
            approved,
            approver: "dashboard-operator",
            reason
          })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(body.detail || `Request failed (${res.status})`);
        }
        approvalDrafts.delete(incidentId);
        showStatusBanner(
          approved
            ? `Thread ${incidentId} approved and resumed.`
            : `Thread ${incidentId} rejected and escalated.`,
          "success"
        );
      } catch (err) {
        showStatusBanner(`Failed to submit decision: ${err.message}`, "error");
      } finally {
        submittingIncidents.delete(incidentId);
        await fetchIncidents(true);
      }
    }

    function closeMobileSidebar() {
      const shell = document.getElementById("app-shell");
      const closeBtn = document.getElementById("btn-close-mobile-sidebar");
      shell.classList.remove("mobile-sidebar-open");
      if (closeBtn) closeBtn.style.display = "none";
    }

    function toggleSidebar() {
      const shell = document.getElementById("app-shell");
      const closeBtn = document.getElementById("btn-close-mobile-sidebar");
      if (window.innerWidth <= 1080) {
        const opening = !shell.classList.contains("mobile-sidebar-open");
        shell.classList.toggle("mobile-sidebar-open", opening);
        if (closeBtn) closeBtn.style.display = opening ? "inline-flex" : "none";
      } else {
        shell.classList.toggle("sidebar-collapsed");
      }
    }

    document.getElementById("btn-sidebar-toggle").addEventListener("click", toggleSidebar);
    document.getElementById("sidebar-backdrop").addEventListener("click", closeMobileSidebar);
    document.getElementById("btn-close-mobile-sidebar").addEventListener("click", closeMobileSidebar);

    document.getElementById("btn-theme-toggle").addEventListener("click", () => {
      const isDark = document.documentElement.classList.contains("dark");
      applyTheme(isDark ? "light" : "dark");
    });

    document.querySelectorAll(".nav-item[data-view]").forEach(btn => {
      btn.addEventListener("click", () => switchView(btn.dataset.view));
    });

    document.getElementById("btn-sync-state").addEventListener("click", () => fetchIncidents(true));
    document.getElementById("nav-demo-btn").addEventListener("click", () => {
      toggleDemoMode(!isDemoMode);
      closeMobileSidebar();
    });
    document.getElementById("btn-demo-toggle").addEventListener("click", () => toggleDemoMode(false));
    document.getElementById("btn-dismiss-banner").addEventListener("click", hideStatusBanner);

    document.getElementById("incident-search").addEventListener("input", (event) => {
      searchQuery = event.target.value || "";
      renderSidebar();
    });

    document.getElementById("filter-tabs").addEventListener("click", (event) => {
      const tab = event.target.closest(".filter-tab[data-filter]");
      if (tab) setFilter(tab.dataset.filter);
    });

    document.getElementById("incident-list").addEventListener("click", (event) => {
      const retry = event.target.closest('[data-action="retry-fetch"]');
      if (retry) {
        fetchIncidents(true);
        return;
      }
      const row = event.target.closest(".incident-row[data-incident-id]");
      if (row) selectIncident(row.dataset.incidentId);
    });

    document.getElementById("inspector").addEventListener("click", (event) => {
      const tab = event.target.closest(".inspector-tab[data-inspector-tab]");
      if (tab) {
        activeInspectorTab = tab.dataset.inspectorTab;
        const inc = incidents.find(i => i.incident_id === selectedIncidentId);
        if (inc) renderInspector(inc, true);
        return;
      }
      const btn = event.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === "approve") submitApprovalDecision(btn.dataset.incidentId, true);
      else if (action === "reject") submitApprovalDecision(btn.dataset.incidentId, false);
      else if (action === "back-to-queue") closeMobileDetail();
      else if (action === "retry-fetch") fetchIncidents(true);
      else if (action === "toggle-demo") toggleDemoMode(true);
    });

    document.getElementById("inspector").addEventListener("input", (event) => {
      if (event.target && event.target.id === "approval-reason-input" && event.target.dataset.incidentId) {
        approvalDrafts.set(event.target.dataset.incidentId, event.target.value);
      }
    });

    initTheme();
    if (isDemoMode) {
      toggleDemoMode(true);
    } else {
      fetchIncidents(true);
    }
    setInterval(() => fetchIncidents(false), 4000);
  </script>
</body>

</html>
