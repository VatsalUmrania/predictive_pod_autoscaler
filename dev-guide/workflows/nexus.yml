name: NEXUS Self-Healing Integration

# ──────────────────────────────────────────────────────────────────────────────
# NEXUS GitHub Action
# Notifies your NEXUS instance of every deploy so it can correlate
# errors that spike after a push with the "bad_deploy" failure class.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   NEXUS_API_URL      — e.g. https://nexus.yourdomain.com   (no trailing slash)
#   NEXUS_SELFHEAL_TOKEN — Token from POST /apps/register
#
# Optional:
#   NEXUS_NOTIFY_ON_FAILURE — set to "true" to also POST on job failure
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["main", "master", "production"]
  pull_request:
    types: [closed]     # merged PRs act like pushes

jobs:
  # ── 1. Notify NEXUS of deploy start ─────────────────────────────────────────
  nexus-deploy-start:
    name: "Notify NEXUS — Deploy Started"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Report deploy start to NEXUS
        run: |
          curl -sf -X POST "${{ secrets.NEXUS_API_URL }}/sdk/event" \
            -H "Authorization: Bearer ${{ secrets.NEXUS_SELFHEAL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type":    "deploy_event",
              "message": "Deploy started on ${{ github.ref_name }} by ${{ github.actor }}",
              "data": {
                "commit":      "${{ github.sha }}",
                "branch":      "${{ github.ref_name }}",
                "author":      "${{ github.actor }}",
                "repo":        "${{ github.repository }}",
                "run_id":      "${{ github.run_id }}",
                "event":       "${{ github.event_name }}",
                "status":      "started",
                "compare_url": "${{ github.event.compare }}"
              }
            }'
        continue-on-error: true   # Never block a deploy because NEXUS is down

  # ── 2. Your actual CI/CD steps go here ──────────────────────────────────────
  build-and-deploy:
    name: "Build & Deploy"
    runs-on: ubuntu-latest
    needs: nexus-deploy-start

    steps:
      - uses: actions/checkout@v4

      # ── Add your build/test/deploy steps below ──────────────────────────────
      # Example:
      # - name: Install deps
      #   run: npm ci
      # - name: Run tests
      #   run: npm test
      # - name: Deploy to production
      #   run: ./deploy.sh
      # ────────────────────────────────────────────────────────────────────────

      - name: Placeholder — replace with your steps
        run: echo "Add your build/test/deploy steps here"

  # ── 3. Notify NEXUS of deploy result ────────────────────────────────────────
  nexus-deploy-result:
    name: "Notify NEXUS — Deploy Result"
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()    # Run on both success AND failure

    steps:
      - name: Report deploy outcome to NEXUS
        run: |
          STATUS="${{ needs.build-and-deploy.result }}"
          # Map GitHub status to NEXUS-friendly type
          if [ "$STATUS" = "success" ]; then
            TYPE="deploy_success"
            MSG="Deploy succeeded on ${{ github.ref_name }}"
          else
            TYPE="deploy_failure"
            MSG="Deploy FAILED on ${{ github.ref_name }} — result: $STATUS"
          fi

          curl -sf -X POST "${{ secrets.NEXUS_API_URL }}/sdk/event" \
            -H "Authorization: Bearer ${{ secrets.NEXUS_SELFHEAL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"type\":    \"$TYPE\",
              \"message\": \"$MSG\",
              \"data\": {
                \"commit\":   \"${{ github.sha }}\",
                \"branch\":   \"${{ github.ref_name }}\",
                \"author\":   \"${{ github.actor }}",
                \"run_id\":   \"${{ github.run_id }}\",
                \"run_url\":  \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"status\":   \"$STATUS\"
              }
            }"
        continue-on-error: true
