[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ppa"
version = "3.1.0"
description = "NEXUS — Self-Healing Cloud System built on the Predictive Pod Autoscaler (PPA)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PPA Contributors"}
]
dependencies = [
    "kopf>=1.43.0",
    "kubernetes>=35.0.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    "scikit-learn>=1.5.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "prometheus-client>=0.19.0",
    "typer>=0.12.0",
    "rich>=14.0.0",
    "prompt-toolkit>=3.0.50",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.0",
    "pydantic>=2.7.0",
    "nats-py>=2.7.0",
]

[project.optional-dependencies]
operator = [
    "ai-edge-litert>=2.0.0",
]
nexus = [
    # Event bus
    "nats-py>=2.7.0",
    # Telemetry
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    # Async DB (audit trail + DBAgent)
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",        # PostgreSQL async driver
    "aiomysql>=0.2.0",        # MySQL async driver
    "motor>=3.3.0",           # MongoDB async driver
    # HTTP client (Prometheus queries, OPA, NetworkAgent health checks)
    "httpx>=0.27.0",
    # Runbook YAML parsing
    "pyyaml>=6.0",
    # Cooldown store Redis backend
    "redis[hiredis]>=5.0.0",
    # LLM for RCA Engine — Gemini is default; openai/anthropic installed via extras
    "google-genai>=1.0.0",
    # LangGraph remediation agent (multi-turn investigation + interrupt/resume approval)
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    # Phase 7: Observability + CLI
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "prometheus-client>=0.20.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "prometheus-api-client>=0.5.5",
    # Already in base: pydantic, kubernetes, requests, python-json-logger
]
# ── LLM provider extras (install the one you use) ─────────────────────────────
gemini = [
    "google-genai>=1.0.0",
]
openai = [
    "openai>=1.30.0",
]
anthropic = [
    "anthropic>=0.28.0",
]
aws = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
]
all = [
    "ai-edge-litert>=2.0.0",
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
]

[project.scripts]
ppa   = "ppa.cli.__main__:main"
nexus = "nexus.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
# src/aws is an unmaintained vendored tree — excluded from lint and formatting.
extend-exclude = ["src/aws"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

# src/aws is an unmaintained vendored tree — keep black off it too.
[tool.black]
extend-exclude = "src/aws"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
