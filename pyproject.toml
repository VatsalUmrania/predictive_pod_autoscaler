[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.0.3"
description = "NEXUS — Self-Healing Cloud System built on the Predictive Pod Autoscaler (PPA)"
readme = "README.md"
requires-python = ">=3.12, <3.15"
license = {text = "MIT"}
authors = [
    {name = "PPA Contributors"}
]
dependencies = [
    "kopf>=1.43.0",
    "kubernetes<=37.0.2",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    "scikit-learn>=1.5.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "prometheus-client>=0.19.0",
    "typer>=0.12.0",
    "rich>=14.0.0",
    "pydantic>=2.7.0",
    "nats-py>=2.7.0",
    "langchain-google-genai==4.5.0",
]

[project.optional-dependencies]
operator = [
    "ai-edge-litert==2.3.0",
]
nexus = [
    "nats-py>=2.7.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "asyncpg>=0.32.0",        # PostgreSQL async driver
    "aiomysql>=0.3.2",        # MySQL async driver
    "motor>=3.3.0",           # MongoDB async driver
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "google-genai==3.3.0",
    "langchain-google-genai==4.5.0",
    "langgraph==1.2.22",
    "langchain-core==1.8.0",
    "fastapi==0.162.7",
    "uvicorn[standard]==0.54.0",
    "prometheus-client==0.26.0",
    "click==8.5.1",
    "rich==15.0.0",
    "prometheus-api-client==0.7.2",
    "boto3==1.44.3",
    "botocore==1.44.3",
]
gemini = [
    "google-genai==3.3.0",
    "langchain-google-genai==4.5.0",
]
openai = [
    "openai==3.51.0",
]
anthropic = [
    "anthropic==2.8.0",
]
aws = [
    "boto3==1.44.3",
    "botocore==1.44.3",
]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "black==26.10.1",
]
all = [
    "ai-edge-litert==2.3.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "black==26.10.1",
]

[project.scripts]
ppa   = "ppa.cli.__main__:main"
nexus = "nexus.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
[tool.black]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
