apiVersion: ppa.example.com/v1
kind: PredictiveAutoscaler
metadata:
  name: test-app-ppa-normalized-rps-t3m
  namespace: default
spec:
  targetDeployment: "test-app"
  appName: "test-app"
  horizon: "normalized_rps_t3m"
  minReplicas: 1
  maxReplicas: 10
  capacityPerPod: 20
  scaleUpRate: 2.0
  scaleDownRate: 0.5
  safetyFactor: 1.15
  observerMode: true
  modelPath: "/models/test-app/normalized_rps_t3m/current/model.tflite"
  scalerPath: "/models/test-app/normalized_rps_t3m/current/scaler.pkl"
  targetScalerPath: "/models/test-app/normalized_rps_t3m/current/target_scaler.pkl"
