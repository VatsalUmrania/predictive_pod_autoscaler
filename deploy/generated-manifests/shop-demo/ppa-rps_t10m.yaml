apiVersion: ppa.example.com/v1
kind: PredictiveAutoscaler
metadata:
  name: shop-demo-ppa-rps-t10m
  namespace: default
spec:
  targetDeployment: "shop-demo"
  appName: "shop-demo"
  horizon: "rps_t10m"
  minReplicas: 1
  maxReplicas: 10
  capacityPerPod: 50
  scaleUpRate: 2.0
  scaleDownRate: 0.5
  safetyFactor: 1.15
  observerMode: false
  modelPath: "/models/shop-demo/rps_t10m/ppa_model_rps_t10m.tflite"
  scalerPath: "/models/shop-demo/rps_t10m/scaler_rps_t10m.pkl"
  targetScalerPath: "/models/shop-demo/rps_t10m/target_scaler_rps_t10m.pkl"
