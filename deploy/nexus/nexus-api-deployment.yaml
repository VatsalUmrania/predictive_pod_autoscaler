# nexus-api Deployment + Services — runs inside Minikube alongside PPA operator.
# Replaces the Docker Compose nexus-api service. All connections are K8s service DNS.
#
# Apply with:
#   kubectl apply -f deploy/nexus/nexus-api-deployment.yaml
#
# After apply, in-cluster access:
#   http://nexus-api.nexus.svc.cluster.local:8080
# Browser access (developer dashboards):
#   http://$(minikube ip):30081
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus
  # Already defined in nats-statefulset.yaml; idempotent — namespace is a global resource.
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/component: self-healing
---
# ServiceAccount for nexus-api pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-api
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus-api
    app.kubernetes.io/component: self-healing
---
# ClusterRole: read-only access to cluster resources needed by NEXUS agents
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nexus-api
  labels:
    app.kubernetes.io/name: nexus-api
    app.kubernetes.io/component: self-healing
rules:
  # K8sAgent: list/watch pods, nodes, events
  - apiGroups: [""]
    resources: ["pods", "nodes", "events", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
  # K8sAgent: read deployments/replicasets for scaling context
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # Prescaler autonomous mode: scale deployments
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  # HPA awareness
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
# Bind the ClusterRole to the nexus-api ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nexus-api
  labels:
    app.kubernetes.io/name: nexus-api
    app.kubernetes.io/component: self-healing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nexus-api
subjects:
  - kind: ServiceAccount
    name: nexus-api
    namespace: nexus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-api
  namespace: nexus
  labels:
    app: nexus-api
    app.kubernetes.io/name: nexus-api
    app.kubernetes.io/component: self-healing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-api
  template:
    metadata:
      labels:
        app: nexus-api
    spec:
      serviceAccountName: nexus-api
      containers:
        - name: nexus-api
          image: ghcr.io/vatsalumrania/nexus-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            - name: NATS_URL
              value: "nats://nats.nexus.svc.cluster.local:4222"
            - name: NEXUS_AUDIT_DB_PATH
              value: /data/nexus_audit.db
            - name: NEXUS_KNOWLEDGE_DB_PATH
              value: /data/nexus_knowledge.db
            - name: NEXUS_LOG_LEVEL
              value: info
            # Prometheus — kube-prometheus-stack service in monitoring namespace
            - name: PROMETHEUS_URL
              value: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
            # LLM Provider configuration (Gemini / OpenAI / Anthropic / none)
            - name: NEXUS_LLM_PROVIDER
              value: "gemini"
            # Model override for the selected provider
            - name: NEXUS_LLM_MODEL
              value: "gemini-3.1-flash-lite"
            # API Key (mounted from secret)
            - name: NEXUS_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: NEXUS_LLM_API_KEY
                  optional: true
          volumeMounts:
            - name: nexus-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: nexus-data
          persistentVolumeClaim:
            claimName: nexus-api-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-api-data
  namespace: nexus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# ClusterIP — used by PPA operator and shop-demo inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: nexus-api
  namespace: nexus
  labels:
    app: nexus-api
spec:
  selector:
    app: nexus-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
  type: ClusterIP
---
# NodePort — used by developers to access NEXUS dashboards from browser.
# Avoids any port-forward requirement.
# Access: http://$(minikube ip):30081
apiVersion: v1
kind: Service
metadata:
  name: nexus-api-external
  namespace: nexus
  labels:
    app: nexus-api
spec:
  selector:
    app: nexus-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
      protocol: TCP
  type: NodePort