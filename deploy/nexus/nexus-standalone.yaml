# NEXUS Self-Healing — Standalone Docker Compose
# ================================================
# No repo clone needed. Just download this file and run:
#
#   curl -O https://raw.githubusercontent.com/VatsalUmrania/predictive_pod_autoscaler/main/deploy/nexus/nexus-standalone.yaml
#   docker compose -f nexus-standalone.yaml up -d
#
# Services started:
#   nexus-api    → http://localhost:8080      (Status API + /docs)
#   grafana      → http://localhost:3000      (Dashboards — admin/nexus_admin)
#   prometheus   → http://localhost:9090      (Metrics)
#   nats         → nats://localhost:4222      (Event bus)
#
# After startup, register your app:
#   curl -X POST http://localhost:8080/apps/register \
#        -H "Content-Type: application/json" \
#        -d '{"app_name": "my-app", "tier": "production"}'
#
# Then in your Python app:
#   pip install git+https://github.com/VatsalUmrania/predictive_pod_autoscaler.git#egg=nexus-selfheal
#   SELFHEAL_TOKEN=sh_xxx NEXUS_API_URL=http://localhost:8080 uvicorn main:app
#
# Environment variables (all optional — sensible defaults included):
#   NEXUS_GEMINI_API_KEY   — Enables Gemini 1.5 Flash for AI-powered RCA
#   SLACK_WEBHOOK          — Slack webhook for SRE alerts
#   GF_ADMIN_PASSWORD      — Grafana admin password (default: nexus_admin)

version: "3.9"

x-nexus-logging: &nexus-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ── NATS JetStream ──────────────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: nexus-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222", "--name", "nexus-nats"]
    ports:
      - "4222:4222"
      - "8222:8222"
    logging: *nexus-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── NEXUS API ───────────────────────────────────────────────────────────────
  nexus-api:
    image: ghcr.io/vatsalumrania/nexus-api:latest
    container_name: nexus-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NATS_URL:                 nats://nats:4222
      NEXUS_AUDIT_DB_PATH:      /data/nexus_audit.db
      NEXUS_KNOWLEDGE_DB_PATH:  /data/nexus_knowledge.db
      NEXUS_GEMINI_API_KEY:     ${NEXUS_GEMINI_API_KEY:-}
      SLACK_WEBHOOK:            ${SLACK_WEBHOOK:-}
      NEXUS_LOG_LEVEL:          info
    volumes:
      - nexus_data:/data
    depends_on:
      nats:
        condition: service_healthy
    logging: *nexus-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: nexus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    # Inline config — no file mount needed
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      nexus-api:
        condition: service_healthy
    logging: *nexus-logging

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: nexus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-nexus_admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_FEATURE_TOGGLES_ENABLE:  publicDashboards
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nexus.json
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/nexus.yaml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/nexus.yaml
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *nexus-logging

# ── Inline configs (no file mount — truly self-contained) ────────────────────
configs:

  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      scrape_configs:
        - job_name: nexus-api
          static_configs:
            - targets: ['nexus-api:8080']
          metrics_path: /metrics

  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus:9090
          isDefault: true
          editable: false

  grafana_dashboard_provider:
    content: |
      apiVersion: 1
      providers:
        - name: nexus
          type: file
          disableDeletion: true
          options:
            path: /var/lib/grafana/dashboards

volumes:
  nexus_data:
  prometheus_data:
  grafana_data:
